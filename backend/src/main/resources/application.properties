# Application
spring.application.name=page-pulse

# Server
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/page_pulse_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Afridi55566677@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

# Jsoup Configuration
app.jsoup.timeout=15000
app.jsoup.user-agent=Mozilla/5.0 (compatible; PagePulseBot/1.0; +https://pagepulse.app)
app.jsoup.follow-redirects=true
app.jsoup.max-body-size=5242880

# Logging
logging.level.com.pagepulse=DEBUG
logging.level.org.springframework.web=INFO
